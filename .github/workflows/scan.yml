name: Kripto sinyal taraması

on:
  schedule:
    # Her 5 dakikada bir, mum kapandıktan 1 dk sonra (01, 06, 11, ... dakikalar).
    # 15m: "1,16,31,46 * * * *"  |  1h: "2 * * * *"  |  4h: "2 */4 * * *"
    - cron: "1-59/5 * * * *"
  workflow_dispatch: {}          # Actions sekmesinden elle çalıştırma butonu

permissions:
  contents: write                # state.json'u (tekrar bildirim engeli) kaydetmek için

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Telegram bağlantı testi (sadece elle çalıştırınca)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --test

      - name: Tara ve bildir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Durumu kaydet
        run: |
          git config user.name "sinyal-bot"
          git config user.email "sinyal-bot@users.noreply.github.com"
          git add state.json kayitlar/
          git diff --cached --quiet && exit 0
          git commit -m "sinyal kaydı $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
