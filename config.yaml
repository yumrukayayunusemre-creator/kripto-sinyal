# ============================================================
#  Kripto Sinyal Botu — ayarlar
# ============================================================

# Taranacak coinler
#   "ALL"  → Binance'teki bütün USDT pariteleri otomatik taranır (liste her çalışmada güncellenir)
#   Ya da elle liste yazabilirsin:  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
symbols: ALL

# "ALL" modunda filtreler
universe:
  min_quote_volume: 3000000   # 24 saatlik işlem hacmi en az 3 milyon USDT olsun (0 = filtre yok)
  max_symbols: 0              # en hacimli N coin ile sınırla (0 = sınır yok)
  exclude:                    # her zaman hariç tutulacaklar
    - USDCUSDT
    - FDUSDUSDT
    - TUSDUSDT
    - USDPUSDT
    - DAIUSDT
    - EURUSDT
    - AEURUSDT
    - USDEUSDT
    - BUSDUSDT
    - XUSDUSDT
    - EURIUSDT
    - PAXGUSDT

# Aynı anda kaç coin indirilsin (paralel tarama)
workers: 8

# Mum periyodu: 15m, 1h, 4h, 1d
# GitHub Actions en sık 5-15 dakikada bir çalışabildiği için 1h veya 4h önerilir.
timeframe: 1h

# Kaç mum geçmiş çekilsin (göstergelerin ısınması için en az 200)
candles: 300

# ------------------------------------------------------------
# Strateji ayarları — her strateji AL (+1) / SAT (-1) oyu verir.
# enabled: false yaparak kapatabilirsin. weight = oyun ağırlığı.
# ------------------------------------------------------------
strategies:
  rsi:
    enabled: true
    weight: 1
    period: 14
    oversold: 30
    overbought: 70

  ema_cross:
    enabled: true
    weight: 1
    fast: 9
    slow: 21

  bollinger_volume:
    enabled: true
    weight: 1
    period: 20
    std: 2.0
    volume_period: 20
    volume_mult: 1.8      # hacim, ortalamanın kaç katı olursa "patlama" sayılır

  macd:
    enabled: true
    weight: 1
    fast: 12
    slow: 26
    signal: 9

  supertrend:             # TradingView'in en popüler trend stratejilerinden
    enabled: true
    weight: 1
    period: 10
    multiplier: 3.0

  stoch_rsi:              # RSI'ın daha hızlı/hassas versiyonu
    enabled: true
    weight: 1
    rsi_period: 14
    stoch_period: 14
    k: 3
    d: 3
    oversold: 20
    overbought: 80

  donchian_breakout:      # "Turtle" kırılım stratejisi: N mumun zirvesi/dibi kırılınca
    enabled: true
    weight: 1
    period: 20

# ------------------------------------------------------------
# Puanlama: son kapanmış mumda (ve önceki `lookback` mumda) gelen oylar toplanır.
# Toplam puan >= min_score ise AL, <= -min_score ise SAT bildirimi gider.
# ------------------------------------------------------------
scoring:
  min_score: 3           # en az 3 strateji aynı yönü göstermeli
  lookback: 2            # sinyaller 2 mum içinde üst üste gelirse birlikte sayılır
  trend_filter: true     # AL sinyali için fiyat EMA200 üstünde, SAT için altında olmalı

# Aynı coin + aynı yön için tekrar bildirim göndermeden önce beklenecek mum sayısı
cooldown_candles: 6

# Bir taramada çok sinyal çıkarsa: bu sayıdan fazlaysa hepsi TEK özet mesajda gönderilir
max_individual_messages: 5

# Her stratejinin tek başına verdiği sinyalleri de ayrıca bildir (çok mesaj gelebilir)
notify_single_strategy: false
