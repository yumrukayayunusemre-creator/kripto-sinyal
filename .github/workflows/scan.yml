name: Kripto sinyal taraması

on:
  schedule:
    # Her saat başını 2 dk geçe (UTC). Mum kapandıktan hemen sonra tarar.
    # 4h kullanıyorsan: "2 */4 * * *"   |   15m kullanıyorsan: "*/15 * * * *"
    - cron: "2 * * * *"
  workflow_dispatch: {}          # Actions sekmesinden elle çalıştırma butonu

permissions:
  contents: write                # state.json'u (tekrar bildirim engeli) kaydetmek için

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Telegram bağlantı testi (sadece elle çalıştırınca)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --test

      - name: Tara ve bildir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Durumu kaydet
        run: |
          git config user.name "sinyal-bot"
          git config user.email "sinyal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "durum güncellendi [skip ci]" && git push)
